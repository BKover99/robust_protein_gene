[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpg_conv"
version = "0.2.0"
description = "Robust protein marker to gene symbol resolution backed by SQLite."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Your Name" }
]
license = "MIT"
dependencies = ["rapidfuzz>=3.0", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ensembl = ["pandas>=2.0", "pybiomart>=0.2.0"]

[project.scripts]
rpg-conv = "rpg_conv.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rpg_conv = ["data/*.csv"]
