[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robust-protein-gene"
version = "0.1.0"
description = "Robust protein marker to gene symbol resolution backed by SQLite."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Your Name" }
]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ensembl = ["pandas>=2.0", "pybiomart>=0.2.0"]

[project.scripts]
robust-protein-gene = "robust_protein_gene.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
